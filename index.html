<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>森森天氣 · Magic Edition</title>
    <link rel="icon" type="image/png" href="./icon-v2.png">
    <link rel="apple-touch-icon" href="./icon-v2.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-v2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 加上 Fredoka 增加樂園感 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Fredoka:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* 迪士尼樂園感配色：天空藍＋夢幻紫＋魔法金 */
            --ac-sky-top: #8FD3FF;
            --ac-sky-mid: #C6A9FF;
            --ac-sky-bottom: #FFBFD5;

            --ac-cream: #FFF9F4;
            --ac-gold: #FFD76A;
            --ac-pink-soft: #FFE4F2;
            --ac-blue-magic: #7C8CFF;

            --ac-brown: #5C4A3A;
            --ac-dark: #3D3440;
            --ac-card-border: #F0E2D2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Zen Maru Gothic', 'Fredoka', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            /* 童話樂園天空背景：上藍下粉＋幾個亮點 */
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.8) 0, transparent 40%),
                radial-gradient(circle at 80% 10%, rgba(255, 255, 255, 0.6) 0, transparent 45%),
                radial-gradient(circle at 15% 80%, rgba(255, 255, 255, 0.4) 0, transparent 45%),
                linear-gradient(180deg, var(--ac-sky-top) 0%, var(--ac-sky-mid) 55%, var(--ac-sky-bottom) 100%);
            min-height: 100vh;
            color: var(--ac-dark);
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* 頂部狀態列：做成樂園票券感 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(18px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 12px rgba(61, 52, 64, 0.1);
        }

        .location-pill {
            background: linear-gradient(120deg, #FFE59D, #FFBBD4);
            color: var(--ac-brown);
            padding: 6px 18px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 1.05rem;
            transform: rotate(-2deg);
            border: 2px solid rgba(255, 255, 255, 0.95);
            box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.12);
        }

        .update-pill {
            font-size: 0.78rem;
            color: var(--ac-dark);
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ==== 動畫 ==== */
        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.7;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(-2px);
            }
        }

        .twinkle {
            animation: twinkle 2.4s ease-in-out infinite;
        }

        /* === 核心：今日焦點卡片 === */
        .hero-card {
            background: radial-gradient(circle at top left, #FFFDF7 0, #FFF3E6 45%, #FFE4F2 100%);
            border-radius: 30px;
            padding: 30px 25px;
            text-align: center;
            box-shadow:
                0 14px 28px rgba(0, 0, 0, 0.18),
                0 0 0 4px rgba(255, 255, 255, 0.95),
                0 0 0 8px rgba(255, 215, 106, 0.35);
            margin-bottom: 25px;
            position: relative;
        }

        /* 上方魔法標籤 */
        .hero-period {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #FFEA94, #FFC8D0);
            color: var(--ac-brown);
            padding: 6px 22px;
            border-radius: 999px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
            letter-spacing: 0.12em;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .hero-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin: 18px 0;
        }

        .hero-icon {
            font-size: 5rem;
            filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.12));
            animation: bounce 3s infinite;
        }

        .hero-temp {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--ac-brown);
            line-height: 1;
            text-shadow: 0 3px 0 rgba(255, 255, 255, 0.8);
        }

        .hero-desc {
            font-size: 1.4rem;
            color: #8A7B70;
            margin-bottom: 18px;
            font-weight: bold;
        }

        /* === 建議區：改成魔法便利貼感 === */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px dashed rgba(224, 216, 192, 0.8);
        }

        .advice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
        }

        .advice-icon {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .advice-text {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--ac-brown);
            margin: 3px 0;
            line-height: 1.2;
        }

        /* === 稍後預報：橫向滑動區 === */
        .section-title {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 12px;
            margin-left: 10px;
            font-weight: 900;
            text-shadow: 1px 1px 3px rgba(61, 52, 64, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title::before {
            content: "✨";
        }

        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .mini-card {
            min-width: 140px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 16px 14px;
            text-align: center;
            border: 3px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .mini-time {
            background: linear-gradient(120deg, #FFEA94, #FFBBD4);
            color: var(--ac-brown);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            display: inline-block;
            margin-bottom: 8px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .mini-icon {
            font-size: 2.4rem;
            margin: 5px 0;
        }

        .mini-temp {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--ac-dark);
        }

        /* Loading 畫面：改成小小魔法師 */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.7) 0, transparent 40%),
                linear-gradient(180deg, var(--ac-sky-top) 0%, var(--ac-sky-mid) 60%, var(--ac-sky-bottom) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .loading-icon {
            font-size: 4rem;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.12));
        }

        .loading-text {
            color: white;
            font-weight: bold;
            margin-top: 16px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-screen">
        <div class="loading-icon">🧙‍♀️</div>
        <p class="loading-text">小小天氣魔法師正在翻開今天的天空劇本…</p>
    </div>

    <div class="status-bar">
        <div class="location-pill">🏰 新北市 · 魔法樂園</div>
        <div id="updateTime" class="update-pill">天空劇本載入中…</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">

        <div id="heroCard"></div>

        <h3 class="section-title">稍後的天空預告</h3>
        <div class="scroll-container" id="futureForecasts"></div>

    </div>

    <script>
        const API_URL = "https://tamsui-weather.zeabur.app/api/weather/kaohsiung";

        function getWeatherIcon(weather) {
            if (!weather) return "✨☁️";
            if (weather.includes("晴")) return "✨☀️";
            if (weather.includes("多雲")) return "🌤️✨";
            if (weather.includes("陰")) return "☁️✨";
            if (weather.includes("雨")) return "🌧️💫";
            if (weather.includes("雷")) return "⛈️⚡";
            return "✨☁️";
        }

        function getAdvice(rainProb, maxTemp) {
            let rainIcon = "✨";
            let rainText = "今天是晴朗魔法日";
            if (parseInt(rainProb) > 30) {
                rainIcon = "🧚‍♀️☂️";
                rainText = "小仙子提醒：帶把傘";
            }

            let clothIcon = "👗";
            let clothText = "輕鬆散步裝";
            if (parseInt(maxTemp) >= 28) {
                clothIcon = "🕶️";
                clothText = "開啟夏日樂園模式";
            } else if (parseInt(maxTemp) <= 20) {
                clothIcon = "🧥";
                clothText = "穿暖一點更好逛";
            }

            return { rainIcon, rainText, clothIcon, clothText };
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 5 && hour < 11) return "早晨";
            if (hour >= 11 && hour < 14) return "中午";
            if (hour >= 14 && hour < 18) return "下午";
            if (hour >= 18 && hour < 23) return "晚上";
            return "深夜";
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            const advice = getAdvice(current.rain, current.maxTemp);
            const period = getTimePeriod(current.startTime);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            document.getElementById('heroCard').innerHTML = `
                <div class="hero-card">
                    <div class="hero-period">TODAY · ${period}</div>
                    <div class="hero-temp-container">
                        <div class="hero-icon twinkle">${getWeatherIcon(current.weather)}</div>
                        <div class="hero-temp">${avgTemp}°</div>
                    </div>
                    <div class="hero-desc">${current.weather}</div>
                    
                    <div class="advice-grid">
                        <div class="advice-item">
                            <div class="advice-icon">${advice.rainIcon}</div>
                            <div class="advice-text">${advice.rainText}</div>
                            <div style="font-size:0.7rem; color:#999">降雨率 ${current.rain}</div>
                        </div>
                        <div class="advice-item">
                            <div class="advice-icon">${advice.clothIcon}</div>
                            <div class="advice-text">${advice.clothText}</div>
                            <div style="font-size:0.7rem; color:#999">最高溫 ${current.maxTemp}°</div>
                        </div>
                    </div>
                </div>
            `;

            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';

            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime);
                const fDate = new Date(f.startTime);
                if (fDate.getDate() !== todayDate) {
                    p = "明天" + p;
                }

                scrollContainer.innerHTML += `
                    <div class="mini-card">
                        <div class="mini-time">${p}</div>
                        <div class="mini-icon twinkle">${getWeatherIcon(f.weather)}</div>
                        <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                        <div style="font-size:0.8rem; color:#888; margin-top:5px;">💧${f.rain}</div>
                    </div>
                `;
            });

            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayIndex = now.getDay();
            const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

            document.getElementById('updateTime').textContent =
                `今日天空劇本：${month}月${date}日 ${days[dayIndex]}`;

            // 關掉 loading，顯示主畫面
            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        async function fetchWeather() {
            try {
                const delayPromise = new Promise(resolve => setTimeout(resolve, 1500));
                const fetchPromise = fetch(API_URL).then(res => res.json());
                const [_, json] = await Promise.all([delayPromise, fetchPromise]);

                if (json.success) {
                    renderWeather(json.data);
                } else {
                    throw new Error("API Error");
                }
            } catch (e) {
                console.error(e);
                alert("天氣資料讀取失敗，小魔法師不小心打翻星砂了！");
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
</body>

</html>
